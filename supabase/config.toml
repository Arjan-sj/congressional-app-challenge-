[functions.map-infrastructure]
verify_jwt = false

[functions.route-directions]
# The handler validates the project key and any signed-in user itself.
verify_jwt = false

[functions.account-auth]
# Project-key validation and bounded authentication quotas run in the handler.
verify_jwt = false

[auth]
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_confirmations = true
double_confirm_changes = true
