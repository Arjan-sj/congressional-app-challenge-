name: Hazard staging workflow
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/hazard-testing.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/hazard-testing.yml'
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci --include=dev --prefix supabase/tests
      - run: npm test --prefix supabase/tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
