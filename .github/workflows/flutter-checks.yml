name: Flutter checks

on:
  push:
    branches: [main, 'setup/**', 'feature/**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Widget and unit tests
        run: flutter test
